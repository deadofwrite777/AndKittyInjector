name: Build AndKittyInjector

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install Ninja
      run: sudo apt-get install -y ninja-build

    - name: Build ARM64 binary
      run: |
        NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d | sort -V | tail -1)
        echo "NDK: $NDK_DIR"

        cmake -S . -B build/arm64 \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DANDROID_STL=c++_static

        cmake --build build/arm64 -- -j$(nproc)

        echo "=== Binary ==="
        find build/arm64 -name "AndKittyInjector" -type f

    - name: Collect artifact
      run: |
        mkdir -p output
        find build/arm64 -name "AndKittyInjector" -type f -exec cp {} output/ \;
        ls -la output/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndKittyInjector-arm64
        path: output/
